# API Keys, sensitive data, credential
# gitleaks
name: Secrets Scan

on:
  workflow_call:

jobs:
    Secrets-scan:
        runs-on: ubuntu-latest
        steps:
          - name: checkout code
            uses: actions/checkout@v6
            with:
              fetch-depth: 0

          - name: Run gitleaks Scanner
            uses: gitleaks/gitleaks-action@v3
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This is handle by git it self